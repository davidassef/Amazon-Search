<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Amazon Product Scraper - Search for products on Amazon and view results">
    <title>Amazon Product Scraper</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body class="bg-gradient-to-br from-[#f3f4f6] to-[#eef2f7] min-h-screen">
    <!-- Header -->
    <header class="bg-amazon-dark text-white shadow-sm border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <h1 class="text-2xl font-bold" data-i18n="title">Amazon Product Scraper</h1>
                
                <!-- Language selector on header right -->
                <div class="flex items-center gap-2">
                    <label for="language-select" class="sr-only" data-i18n="language">Language</label>
                    <select id="language-select" class="form-select bg-white text-gray-900 min-w-[130px]">
                        <option value="en">🇺🇸 English</option>
                        <option value="pt">🇧🇷 Português</option>
                        <option value="es">🇪🇸 Español</option>
                    </select>
                    <!-- Custom language dropdown container (progressive enhancement) -->
                    <div id="language-custom" class="relative hidden md:block"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Search Section -->
        <section class="search-section bg-white rounded-2xl shadow-lg p-8 mb-8">
            <div class="text-center mb-6">
                <h2 class="text-3xl font-bold text-gray-900 mb-2" data-i18n="searchTitle">Find products on Amazon</h2>
                <p class="text-gray-600" data-i18n="searchSubtitle">Enter a product name and select your preferred Amazon country</p>
            </div>
            
            <form id="search-form" class="max-w-3xl mx-auto">
                <div class="search-container grid gap-3 md:grid-cols-[1fr_auto_auto] items-start">
                    <!-- Search input -->
                    <div class="relative">
                        <label for="search-input" class="sr-only" data-i18n="searchFor">Search for products</label>
                        <input 
                            type="text" 
                            id="search-input" 
                            class="search-input w-full px-4 py-3 text-base md:text-lg border-2 border-gray-300 rounded-xl focus:ring-2 focus:ring-amazon-orange focus:border-amazon-orange outline-none transition-all duration-200" 
                            data-i18n-placeholder="searchPlaceholder"
                            placeholder="Enter product keyword (e.g., laptop, headphones, books...)"
                            required
                            autocomplete="off"
                        >
                        <div id="suggestions" class="suggestions-dropdown hidden absolute top-full left-0 right-0 bg-white border border-gray-300 rounded-xl shadow-lg z-10 max-h-60 overflow-y-auto"></div>
                    </div>

                    <!-- Submit button -->
                    <button 
                        type="submit" 
                        id="search-button" 
                        class="search-button w-full md:w-auto bg-amazon-orange hover:bg-[#e08500] text-white font-semibold py-3 px-6 md:py-4 md:px-8 rounded-xl transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                        data-i18n="searchButton"
                    >
                        Search Products
                    </button>

                    <!-- Country/Region selector with flag (to the right of search button) -->
                    <div class="relative" id="country-multiselect">
                        <button type="button" id="country-multiselect-button" class="form-select min-w-[160px] text-left">
                            <span data-i18n="selectRegions">Select Regions</span>
                        </button>
                        <div id="country-multiselect-dropdown" class="hidden absolute z-10 w-full bg-white rounded-md shadow-lg">
                            <ul class="max-h-60 overflow-auto">
                                <!-- Options will be dynamically inserted here -->
                            </ul>
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center justify-center mt-4 text-sm text-gray-500 hidden" id="comparison-options">
                     <div class="flex items-center">
                        <input id="convert-currency-checkbox" type="checkbox" class="h-4 w-4 text-amazon-orange focus:ring-amazon-orange border-gray-300 rounded">
                        <label for="convert-currency-checkbox" class="ml-2 block text-sm text-gray-700" data-i18n="convertCurrency">Convert to</label>
                        <select id="currency-select" class="ml-2 form-select text-sm">
                            <option value="BRL">BRL</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="JPY">JPY</option>
                        </select>
                    </div>
                </div>
            </form>
        </section>

        <!-- Loading Section -->
        <section id="loading-section" class="loading-section hidden text-center py-12">
            <div class="loading-spinner mx-auto mb-4"></div>
            <div class="loading-messages">
                <p id="loading-message" class="text-lg font-medium text-gray-700" data-i18n="loadingMessage">Scraping Amazon products...</p>
                <p id="loading-status" class="text-sm text-gray-500 mt-2"></p>
            </div>
        </section>

        <!-- Results Section -->
        <section id="results-section" class="results-section hidden">
            <div class="results-header mb-8 space-y-6">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900" data-i18n="resultsTitle">Search Results</h2>
                        <p class="text-gray-600 mt-1">
                            <span id="results-count"></span>
                            <span id="results-keyword"></span>
                        </p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button id="filter-toggle" class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 011 1v3a1 1 0 01-.293.707L12 11.414V15a1 1 0 01-.293.707l-2 2A1 1 0 018 17v-5.586L3.293 7.707A1 1 0 013 7V3z" clip-rule="evenodd" />
                            </svg>
                            <span data-i18n="filters">Filters</span>
                        </button>
                        <div class="relative">
                            <select id="sort-by" class="appearance-none bg-white border border-gray-300 rounded-lg pl-3 pr-8 py-2 focus:outline-none focus:ring-2 focus:ring-amazon-orange focus:border-amazon-orange">
                                <option value="relevance" data-i18n="sortRelevance">Relevance</option>
                                <option value="price-asc" data-i18n="sortPriceAsc">Price: Low to High</option>
                                <option value="price-desc" data-i18n="sortPriceDesc">Price: High to Low</option>
                                <option value="rating-asc" data-i18n="sortRatingAsc">Lowest Rated</option>
                                <option value="rating-desc" data-i18n="sortRating">Top Rated</option>
                                <option value="date-desc" data-i18n="sortDateDesc">Newest</option>
                                <option value="date-asc" data-i18n="sortDateAsc">Oldest</option>
                                <option value="newest" data-i18n="sortNewest">Newest Arrivals</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                                <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                    <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Filtros -->
                <div id="filters-panel" class="hidden mt-8 mb-6 p-6 md:p-8 bg-white rounded-xl shadow-md border border-gray-200">
                    <form id="filters-form">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                        <!-- Filtro de Preço -->
                        <div class="space-y-2">
                            <label for="min-price" class="block text-sm font-medium text-gray-700" data-i18n="priceRange">Price Range</label>
                            <div class="flex items-center gap-2">
                                <input type="number" id="min-price" placeholder="Min" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-amazon-orange focus:border-amazon-orange" data-i18n-placeholder="minPrice">
                                <span class="text-gray-500">-</span>
                                <input type="number" id="max-price" placeholder="Max" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-amazon-orange focus:border-amazon-orange" data-i18n-placeholder="maxPrice">
                            </div>
                        </div>
                        
                        <!-- Filtro de Avaliação -->
                        <div class="space-y-2">
                            <label for="min-rating" class="block text-sm font-medium text-gray-700" data-i18n="minRating">Minimum Rating</label>
                            <select id="min-rating" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-amazon-orange focus:border-amazon-orange">
                                <option value="" data-i18n="anyRating">Any Rating</option>
                                <option value="4">4+ stars & Up</option>
                                <option value="3">3+ stars & Up</option>
                                <option value="2">2+ stars & Up</option>
                                <option value="1">1+ stars & Up</option>
                            </select>
                        </div>
                        
                        <!-- Filtro de Marca -->
                        <div class="space-y-2">
                            <label for="brand" class="block text-sm font-medium text-gray-700" data-i18n="brand">Brand</label>
                            <input type="text" id="brand" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-amazon-orange focus:border-amazon-orange" data-i18n-placeholder="brandPlaceholder" placeholder="e.g. Apple, Samsung">
                        </div>

                        <!-- Filtro de Data -->
                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700" data-i18n="dateRange">Date Range</label>
                            <div class="flex flex-col gap-2">
                                <input type="date" id="date-from" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-amazon-orange focus:border-amazon-orange" aria-label="Start date" data-i18n-placeholder="startDate">
                                <input type="date" id="date-to" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-amazon-orange focus:border-amazon-orange" aria-label="End date" data-i18n-placeholder="endDate">
                            </div>
                        </div>

                        <!-- Filtro de Frete Grátis -->
                        <div class="space-y-2 flex items-end">
                            <div class="flex items-center h-5">
                                <input id="free-shipping" type="checkbox" class="h-4 w-4 text-amazon-orange focus:ring-amazon-orange border-gray-300 rounded">
                                <label for="free-shipping" class="ml-2 block text-sm text-gray-700" data-i18n="freeShipping">Free Shipping</label>
                            </div>
                        </div>
                        
                        <!-- Botão Aplicar Filtros -->
                        <div class="flex items-end">
                            <button type="submit" id="apply-filters" class="w-full bg-amazon-orange hover:bg-orange-600 text-white font-medium py-2 px-4 rounded-md transition-colors" data-i18n="applyFilters">
                                <span data-i18n="applyFilters">Apply Filters</span>
                            </button>
                        </div>
                    </div>
                </form>
                </div>
            </div>

            <!-- Active filters summary chips -->
            <div id="filters-summary" class="hidden mt-4"></div>

            <div id="results-grid" class="results-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Product cards will be inserted here -->
            </div>
            <div id="comparison-results-grid" class="hidden">
                <!-- Comparison results will be inserted here -->
            </div>
        </section>

        <!-- Error Section -->
        <section id="error-section" class="error-section hidden text-center py-12">
            <div class="bg-red-50 border border-red-200 rounded-xl p-6 max-w-md mx-auto">
                <div class="text-red-600 mb-2">
                    <svg class="w-8 h-8 mx-auto" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <p id="error-message" class="text-red-700 font-medium"></p>
                <button id="retry-button" class="mt-4 bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200">
                    Try Again
                </button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="text-center">
                <p class="text-gray-600 mb-2" data-i18n="footerTech">Built with Bun, Vite & Tailwind CSS</p>
                <p class="text-sm text-gray-500" data-i18n="footerFeatures">12 Countries • Real-time Data</p>
                <p class="text-sm text-gray-500 mt-2" data-i18n="footerCopyright">© 2025 • Educational purposes only</p>
            </div>
        </div>
    </footer>

    <!-- Twemoji for reliable cross-platform emoji rendering -->
    <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
